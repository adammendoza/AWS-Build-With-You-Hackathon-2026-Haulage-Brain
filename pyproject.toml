[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "load-quoting-swarm"
version = "0.1.0"
description = "Human-gated agent swarm for UK freight load pricing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  # 1.9.3 is the newest release whose transitive wheels resolve on Intel macOS.
  "crewai==1.9.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
load-swarm = "load_quoting_swarm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
