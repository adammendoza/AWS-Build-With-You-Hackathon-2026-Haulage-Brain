[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "haulage-brain"
version = "0.1.0"
description = "Haulage Brain: human-gated agent swarm for UK freight load pricing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  # 1.9.3 is the newest release whose transitive wheels resolve on Intel macOS.
  "crewai==1.9.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
haulage-brain = "load_quoting_swarm.cli:main"
haulage-brain-ui = "load_quoting_swarm.web:main"
# Backwards-compatible aliases for the original hackathon prototype.
load-swarm = "load_quoting_swarm.cli:main"
load-swarm-ui = "load_quoting_swarm.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
load_quoting_swarm = ["web_assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
